<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutlu Yıllar!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b020a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Arka plan ve kart çerçevesi */
    .image-wrapper {
      position: relative;
      width: min(92vw, 550px);
      height: min(92vw, 550px);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(255, 100, 150, 0.25), 0 0 100px rgba(255, 180, 50, 0.2);
    }

    .main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Tuval efektleri (Konfeti ve Işıltı) */
    canvas#effects {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Mumların üzerine gelen canlı titreşen ışık efektleri */
    .flame-overlay {
      position: absolute;
      width: 18px;
      height: 30px;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,210,70,0.8) 45%, rgba(255,80,0,0) 80%);
      border-radius: 50%;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 12;
      animation: pulse 0.12s infinite alternate ease-in-out;
    }
    .flame-1 {
      top: 40.5%;
      left: 44.5%;
    }
    .flame-2 {
      top: 41%;
      left: 54.8%;
    }

    @keyframes pulse {
      0% { transform: scale(0.9) translateY(1px); opacity: 0.85; }
      100% { transform: scale(1.15) translateY(-2px); opacity: 1; }
    }

    /* İnteraktif Buton */
    .btn-action {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #310014;
      font-weight: bold;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 190, 0, 0.5);
      transition: all 0.25s ease;
    }
    .btn-action:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 6px 25px rgba(255, 190, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="image-wrapper" id="container">
    <!-- Ana Görsel -->
    <img src="pasta.png" alt="Doğum Günü" class="main-img" id="cakeImg">

    <!-- Canlı Mum Parlamaları -->
    <div class="flame-overlay flame-1" id="flame1"></div>
    <div class="flame-overlay flame-2" id="flame2"></div>

    <!-- Animasyon Tuvali -->
    <canvas id="effects"></canvas>

    <!-- Buton -->
    <button class="btn-action" onclick="celebrate()">🎂 Mumları Üfle & Kutla!</button>
  </div>

  <script>
    const canvas = document.getElementById('effects');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('container');

    function resize() {
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Sürekli dökülen altın ve parlak konfetiler
    let confettis = [];
    const colors = ['#ffd700', '#ffb6c1', '#ffffff', '#ff69b4', '#ffa500'];

    for (let i = 0; i < 45; i++) {
      confettis.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 3 + 1.5,
        d: Math.random() * 2 + 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.random() * 10 - 5
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      confettis.forEach(c => {
        ctx.beginPath();
        ctx.fillStyle = c.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = c.color;
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();

        c.y += c.d * 0.7;
        c.x += Math.sin(c.y * 0.05);

        if (c.y > canvas.height) {
          c.y = -10;
          c.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(draw);
    }
    draw();

    // Mumları söndürme ve büyük kutlama efekti
    function celebrate() {
      const f1 = document.getElementById('flame1');
      const f2 = document.getElementById('flame2');
      if (f1 && f2) {
        f1.style.display = 'none';
        f2.style.display = 'none';
      }

      // 100 ekstra parlak konfeti patlaması
      for (let i = 0; i < 90; i++) {
        confettis.push({
          x: canvas.width / 2,
          y: canvas.height * 0.45,
          r: Math.random() * 4 + 2,
          d: Math.random() * 6 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 20 - 10
        });
      }
    }
  </script>
</body>
</html>
