<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doğum Günün Kutlu Olsun!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1f0d1a 0%, #080208 100%);
      color: #fff;
      font-family: 'Caveat', cursive;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }
    canvas#fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .card {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      max-width: 600px;
      width: 90%;
    }
    .neon-text {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.3;
      color: #fff7e6;
      text-shadow: 
        0 0 10px rgba(255, 215, 0, 0.8),
        0 0 20px rgba(255, 180, 0, 0.6),
        0 0 30px rgba(255, 120, 0, 0.4);
      margin-bottom: 25px;
      user-select: none;
    }
    .heart {
      display: block;
      font-size: 2.2rem;
      margin-top: 8px;
    }

    /* Pasta ve Mumlar */
    .cake-container {
      position: relative;
      width: 280px;
      height: 220px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* 19 Mumları */
    .candles {
      display: flex;
      gap: 16px;
      position: absolute;
      top: 15px;
      z-index: 3;
    }
    .candle {
      position: relative;
      font-size: 3.8rem;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.9), 0 2px 5px rgba(0,0,0,0.7);
    }
    .flame {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 24px;
      background: radial-gradient(ellipse at bottom, #fff 0%, #ffdf6d 40%, #ff5e00 80%, transparent 100%);
      border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
      box-shadow: 0 0 20px #ff9400, 0 0 40px #ff3c00;
      animation: flicker 0.15s infinite alternate ease-in-out;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.95; }
      100% { transform: translateX(-50%) scale(1.08) rotate(2deg); opacity: 1; }
    }

    /* Çikolatalı Pasta Katmanları */
    .cake {
      width: 260px;
      height: 120px;
      background: linear-gradient(180deg, #381a14 0%, #200f0c 100%);
      border-radius: 16px 16px 10px 10px;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 6px 10px rgba(255, 255, 255, 0.1);
    }
    /* Çikolata Sosu / Ganaj Damlaları */
    .drip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 25px;
      background: #1e0b08;
      border-radius: 16px 16px 12px 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }
    .plate {
      width: 300px;
      height: 14px;
      background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
      border-radius: 20px;
      margin-top: -4px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <canvas id="fireworks"></canvas>

  <div class="card">
    <div class="neon-text">
      Doğum günün kutlu olsun<br>
      iyi ki doğmuşsun<br>
      Canımmmm dostumm
      <span class="heart">— ♡ —</span>
    </div>

    <div class="cake-container">
      <div class="candles">
        <div class="candle">
          <div class="flame"></div>
          1
        </div>
        <div class="candle">
          <div class="flame"></div>
          9
        </div>
      </div>
      <div class="cake">
        <div class="drip"></div>
      </div>
      <div class="plate"></div>
    </div>
  </div>

  <script>
    // Havai Fişek & Parıltı Efekti
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
        this.size = Math.random() * 2.5 + 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy + 0.3; // hafif yer çekimi
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.6);
      const colors = ['#ffd700', '#ff69b4', '#ff4500', '#00ffff', '#ffffff', '#e066ff'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 40; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(8, 2, 8, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.06) {
        createFirework();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
